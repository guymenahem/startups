interface:
  display_name: "Review Bedrock Migration"
  short_description: "Review migration to OpenAI models on Amazon Bedrock (AWS)"
  default_prompt: "Use $aws-startups-solution-architecture:openai-on-bedrock-review to review this migration against its agreed scope and current documentation. Check cutover, the recommendation for optional modernization to the newest suitable supported OpenAI models with Responses API or Bedrock Managed Agents, framework preservation, and verification evidence. Do not change files; return prioritized findings and separate cutover and modernization status without treating unselected modernization as a failure."
